name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -q
      - name: Validate notebooks and modules
        run: python -m compileall -q src run_baseline.py && python -m json.tool notebooks/02_arima.ipynb >/dev/null && python -m json.tool notebooks/03_Prophet.ipynb >/dev/null && python -m json.tool notebooks/04_lstm.ipynb >/dev/null && python -m json.tool notebooks/05_tft.ipynb >/dev/null && python -m json.tool notebooks/06_qnn.ipynb >/dev/null
